<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Wildtiere - Timor Novoselsky</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topVignette"></div>

<header class="fixedHeader">
    <div class="headerInner">
        <div class="branding">
            <a href="index-de.html">
                <h1>Timor Novoselsky</h1>
                <div class="subtitle">FOTOGRAFIE</div>
            </a>
        </div>
        
        <div class="navControls">
            <div class="langSwitch">
                <a href="wildlife.html" class="langOption">EN</a>
                <span class="langDivider">|</span>
                <a href="wildlife-de.html" class="langOption activeLang">DE</a>
            </div>
            
            <div class="navMenu" onclick="toggleMenu()">MENÜ</div>
        </div>
    </div>
</header>

<div id="fullScreenMenu" class="overlayMenu">
    <div class="closeBtn" onclick="toggleMenu()">&#10005;</div> 
    <div class="menuLinks">
        <a href="index-de.html" class="gapAfter">Startseite</a>
        <a href="wildlife-de.html">Wildtiere</a>
        <a href="landscapes-de.html">Landschaften</a>
        <a href="culture-de.html">Mensch & Kultur</a>
        <a href="stories-de.html" class="gapAfter">Geschichten</a>
        <a href="about-de.html">Über mich</a>
        <a href="contact-de.html">Kontakt</a>
    </div>
</div>

<div class="pageContainer">
    <div class="pageHeader">
        <h1 class="pageTitle">Wildtiere</h1>
        <div class="filterContainer">
            <div class="filterTag activeTag" onclick="filterGallery('all', this)">Alle</div>
            <div class="filterTag" onclick="filterGallery('birds', this)">Vögel</div>
            <div class="filterTag" onclick="filterGallery('mammals', this)">Säugetiere</div>
            <div class="filterTag" onclick="filterGallery('macro', this)">Makro</div>
        </div>
    </div>

    <div class="galleryContainer">
        <div class="galleryItem">
            <img src="https://picsum.photos/800/600?random=11" class="galleryImg" category="birds" caption="Alpendohle fliegt über den Eiger, Schweiz" onclick="openLightbox(this)">
        </div>
        <div class="galleryItem">
            <img src="https://picsum.photos/800/600?random=12" class="galleryImg" category="birds" caption="Bartgeier im Schweizer Nationalpark" onclick="openLightbox(this)">
        </div>
        <div class="galleryItem">
            <img src="https://picsum.photos/1200/600?random=13" class="galleryImg" category="mammals" caption="Guanako-Herde grasend in Torres del Paine, Patagonien" onclick="openLightbox(this)">
        </div>
        <div class="galleryItem">
            <img src="https://picsum.photos/800/600?random=14" class="galleryImg" category="macro" caption="Tautropfen auf alpiner Flora, Schweizer Alpen" onclick="openLightbox(this)">
        </div>
        <div class="galleryItem">
            <img src="https://picsum.photos/800/600?random=15" class="galleryImg" category="birds" caption="Königspinguine versammeln sich an den Küsten von Südgeorgien" onclick="openLightbox(this)">
        </div>
        <div class="galleryItem">
            <img src="https://picsum.photos/1200/600?random=16" class="galleryImg" category="macro" caption="Detaillierte Texturen heimischen Mooses, Fiordland, Neuseeland" onclick="openLightbox(this)">
        </div>
        <div class="galleryItem">
            <img src="https://picsum.photos/800/600?random=17" class="galleryImg" category="mammals" caption="Alpensteinbock rastet auf den felsigen Gratlinien des Pilatus" onclick="openLightbox(this)">
        </div>
        <div class="galleryItem">
            <img src="https://picsum.photos/800/600?random=18" class="galleryImg" category="mammals" caption="Gämse klettert an den steilen Hängen nahe Interlaken" onclick="openLightbox(this)">
        </div>
        <div class="galleryItem">
            <img src="https://picsum.photos/1200/600?random=19" class="galleryImg" category="birds" caption="Schneesturmvogel gleitet an den Eiswänden der Antarktis" onclick="openLightbox(this)">
        </div>
        <div class="galleryItem">
            <img src="https://picsum.photos/800/600?random=20" class="galleryImg" category="macro" caption="Verborgene Muster alpiner Flechten" onclick="openLightbox(this)">
        </div>
    </div>
</div>

<div id="lightbox" class="lightboxOverlay" onclick="closeLightbox()">
    <div class="closeLightbox">&times;</div>
    <img id="lightboxImg" class="lightboxImg" src="" alt="">
    <div class="lightboxDetails" onclick="event.stopPropagation()">
        <div id="lightboxCaption" class="lightboxTitle"></div>
        <button class="lightboxBuyBtn" onclick="buyDownload(event)">Digitale Datei in hoher Auflösung kaufen (35 CHF)</button>
        <div class="lightboxSpecs">
            Format: Hochauflösende digitale Datei (Master-JPEG)<br>
            Lizenz: Inklusive Lizenz für den privaten Kunstdruck
        </div>
    </div>
</div>

<div id="scrollTopBtn" class="scrollTopBtn" onclick="scrollToTop(event)">
    <svg class="scrollBtnSvg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
</div>

<script>
    function toggleMenu() { document.getElementById("fullScreenMenu").classList.toggle("active"); }

    function filterGallery(category, element) {
        const tags = document.querySelectorAll('.filterTag');
        tags.forEach(tag => tag.classList.remove('activeTag'));
        element.classList.add('activeTag');
        
        const items = document.querySelectorAll('.galleryItem');
        items.forEach(item => {
            const img = item.querySelector('.galleryImg');
            const imgCategory = img.getAttribute('category');
            if (category === 'all' || imgCategory === category) {
                item.style.display = 'flex';
                setTimeout(() => item.style.opacity = '1', 10);
            } else {
                item.style.opacity = '0';
                item.style.display = 'none';
            }
        });
    }

    window.addEventListener('scroll', function() {
        const scrollTop = window.scrollY;
        const topBtn = document.getElementById('scrollTopBtn');
        if (scrollTop > 400) {
            topBtn.classList.add('showBtn');
        } else {
            topBtn.classList.remove('showBtn');
        }
    });

    function scrollToTop(event) {
        event.stopPropagation();
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    function openLightbox(imgElement) {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxCaption = document.getElementById("lightboxCaption");
        
        lightboxImg.src = imgElement.src;
        lightboxCaption.textContent = imgElement.getAttribute("caption") || "";
        lightbox.classList.add("activeLightbox");
    }

    function closeLightbox() {
        document.getElementById("lightbox").classList.remove("activeLightbox");
    }

    function buyDownload(event) {
        event.stopPropagation();
        alert('Kauf der hochauflösenden digitalen Datei gestartet (35 CHF). Vielen Dank!');
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeLightbox();
        }
    });
</script>

</body>
</html>
