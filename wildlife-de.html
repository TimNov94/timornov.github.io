<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Wildtiere - Timor Novoselsky</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topVignette"></div>

<div id="fixedHeader" class="fixedHeader">
    <a href="index-de.html" class="backButton"><span>&#8592;</span> ZURÜCK</a>
    <div class="langSelector" onclick="toggleLangMenu(event)">
        <svg class="globeIcon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 014-10z"></path>
        </svg>
        <div id="langDropdown" class="langDropdown">
            <a href="wildlife.html">EN</a>
            <a href="wildlife-de.html">DE</a>
        </div>
    </div>
    <header class="galleryHeader">
        <h1>Wildtiere</h1>
        <div class="filterContainer">
            <div class="filterTag activeTag" onclick="filterGallery('all', this)">Alle</div>
            <div class="filterTag" onclick="filterGallery('birds', this)">Vögel</div>
            <div class="filterTag" onclick="filterGallery('mammals', this)">Säugetiere</div>
            <div class="filterTag" onclick="filterGallery('macro', this)">Makro</div>
        </div>
    </header>
</div>

<div class="galleryContainer">
    <img src="https://picsum.photos/800/600?random=11" class="galleryImg imgSmall" category="birds" caption="Alpendohle fliegt über den Eiger, Schweiz" onclick="openLightbox(this)">
    <img src="https://picsum.photos/800/600?random=12" class="galleryImg imgSmall" category="birds" caption="Bartgeier im Schweizer Nationalpark" onclick="openLightbox(this)">
    <img src="https://picsum.photos/1200/600?random=13" class="galleryImg imgLarge" category="mammals" caption="Guanako-Herde grasend in Torres del Paine, Patagonien" onclick="openLightbox(this)">
    
    <img src="https://picsum.photos/800/600?random=14" class="galleryImg imgSmall" category="macro" caption="Tautropfen auf alpiner Flora, Schweizer Alpen" onclick="openLightbox(this)">
    <img src="https://picsum.photos/800/600?random=15" class="galleryImg imgSmall" category="birds" caption="Königspinguine versammeln sich an den Küsten von Südgeorgien" onclick="openLightbox(this)">
    <img src="https://picsum.photos/1200/600?random=16" class="galleryImg imgLarge" category="macro" caption="Detaillierte Texturen heimischen Mooses, Fiordland, Neuseeland" onclick="openLightbox(this)">
    
    <img src="https://picsum.photos/800/600?random=17" class="galleryImg imgSmall" category="mammals" caption="Alpensteinbock rastet auf den felsigen Gratlinien des Pilatus" onclick="openLightbox(this)">
    <img src="https://picsum.photos/800/600?random=18" class="galleryImg imgSmall" category="mammals" caption="Gämse klettert an den steilen Hängen nahe Interlaken" onclick="openLightbox(this)">
    <img src="https://picsum.photos/1200/600?random=19" class="galleryImg imgLarge" category="birds" caption="Schneesturmvogel gleitet an den Eiswänden der Antarktis" onclick="openLightbox(this)">
    
    <img src="https://picsum.photos/800/600?random=20" class="galleryImg imgSmall" category="macro" caption="Verborgene Muster alpiner Flechten" onclick="openLightbox(this)">
</div>

<div id="lightbox" class="lightboxOverlay" onclick="closeLightbox()">
    <div class="closeLightbox">&times;</div>
    <img id="lightboxImg" class="lightboxImg" src="" alt="">
    <div id="lightboxCaption" class="lightboxCaption"></div>
</div>

<div id="scrollTopBtn" class="scrollTopBtn" onclick="scrollToTop(event)">
    <svg class="scrollBtnSvg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
</div>

<script>
    function toggleLangMenu(event) { event.stopPropagation(); document.getElementById("langDropdown").classList.toggle("showLang"); }
    window.addEventListener('click', function() {
        const dropdown = document.getElementById("langDropdown");
        if (dropdown && dropdown.classList.contains("showLang")) { dropdown.classList.remove("showLang"); }
    });

    function filterGallery(category, element) {
        const tags = document.querySelectorAll('.filterTag');
        tags.forEach(tag => tag.classList.remove('activeTag'));
        element.classList.add('activeTag');
        
        const images = document.querySelectorAll('.galleryImg');
        images.forEach(img => {
            const imgCategory = img.getAttribute('category');
            if (category === 'all' || imgCategory === category) {
                img.style.display = '';
                setTimeout(() => img.style.opacity = '1', 10);
            } else {
                img.style.opacity = '0';
                img.style.display = 'none';
            }
        });
    }

    window.addEventListener('scroll', function() {
        const scrollTop = window.scrollY;
        
        let opacityValue = 1 - (scrollTop / 60);
        if (opacityValue < 0.25) {
            opacityValue = 0.25;
        }
        
        document.getElementById('fixedHeader').style.opacity = opacityValue;

        const topBtn = document.getElementById('scrollTopBtn');
        if (scrollTop > 400) {
            topBtn.classList.add('showBtn');
        } else {
            topBtn.classList.remove('showBtn');
        }
    });

    function scrollToTop(event) {
        event.stopPropagation();
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    function openLightbox(imgElement) {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxCaption = document.getElementById("lightboxCaption");
        
        lightboxImg.src = imgElement.src;
        lightboxCaption.textContent = imgElement.getAttribute("caption") || "";
        lightbox.classList.add("activeLightbox");
    }

    function closeLightbox() {
        document.getElementById("lightbox").classList.remove("activeLightbox");
    }
</script>

</body>
</html>
