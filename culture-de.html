<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mensch & Kultur - Timor Novoselsky</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topVignette"></div>

<header class="fixedHeader">
    <div class="headerInner">
        <div class="branding">
            <a href="index-de.html">
                <h1>Timor Novoselsky</h1>
                <div class="subtitle">FOTOGRAFIE</div>
            </a>
        </div>
        
        <div class="navControls">
            <div class="langSwitch">
                <a href="culture.html" class="langOption">EN</a>
                <span class="langDivider">|</span>
                <a href="culture-de.html" class="langOption activeLang">DE</a>
            </div>
            
            <div class="navMenu" onclick="toggleMenu()">MENÜ</div>
        </div>
    </div>
</header>

<div id="fullScreenMenu" class="overlayMenu">
    <div class="closeBtn" onclick="toggleMenu()">&#10005;</div> 
    <div class="menuLinks">
        <a href="index-de.html" class="gapAfter">Startseite</a>
        <a href="wildlife-de.html">Wildtiere</a>
        <a href="landscapes-de.html">Landschaften</a>
        <a href="culture-de.html">Mensch & Kultur</a>
        <a href="stories-de.html" class="gapAfter">Geschichten</a>
        <a href="about-de.html">Über mich</a>
        <a href="contact-de.html">Kontakt</a>
    </div>
</div>

<div class="pageContainer">
    <div class="pageHeader">
        <h1 class="pageTitle">Mensch & Kultur</h1>
        <div class="filterContainer">
            <div class="filterTag activeTag" onclick="filterGallery('all', this)">Alle</div>
            <div class="filterTag" onclick="filterGallery('portraits', this)">Porträts</div>
            <div class="filterTag" onclick="filterGallery('festivals', this)">Feste</div>
            <div class="filterTag" onclick="filterGallery('street', this)">Straßenfotografie</div>
            <div class="filterTag" onclick="filterGallery('dailylife', this)">Alltag</div>
            <div class="filterTag" onclick="filterGallery('artisans', this)">Kunsthandwerk</div>
        </div>
    </div>

    <div class="galleryContainer">
        <img src="https://picsum.photos/800/600?random=201" class="galleryImg imgSmall" data-categories="portraits dailylife" caption="Ein Älterer lächelt auf dem lokalen Markt" onclick="openLightbox(this)">
        <img src="https://picsum.photos/800/600?random=202" class="galleryImg imgSmall" data-categories="festivals" caption="Farbenfrohe Feierlichkeiten während des Frühlingsfestes" onclick="openLightbox(this)">
        
        <img src="https://picsum.photos/1200/600?random=203" class="galleryImg imgLarge" data-categories="street dailylife" caption="Morgendliches Treiben in den engen Gassen" onclick="openLightbox(this)">
        
        <img src="https://picsum.photos/800/600?random=204" class="galleryImg imgSmall" data-categories="artisans portraits" caption="Ein lokaler Holzschnitzer konzentriert auf feine Details in seiner Werkstatt" onclick="openLightbox(this)">
        <img src="https://picsum.photos/800/600?random=205" class="galleryImg imgSmall" data-categories="dailylife" caption="Gespräch bei einer Tasse Tee unter Freunden" onclick="openLightbox(this)">
        
        <img src="https://picsum.photos/1200/600?random=206" class="galleryImg imgLarge" data-categories="festivals street" caption="Tänzer bewegen sich zum Rhythmus traditioneller Trommeln" onclick="openLightbox(this)">
        
        <img src="https://picsum.photos/800/600?random=207" class="galleryImg imgSmall" data-categories="artisans dailylife" caption="Weben traditioneller Textilien im Dorf" onclick="openLightbox(this)">
        <img src="https://picsum.photos/800/600?random=208" class="galleryImg imgSmall" data-categories="portraits" caption="Ein Moment stiller Reflexion" onclick="openLightbox(this)">
        
        <img src="https://picsum.photos/1200/600?random=209" class="galleryImg imgLarge" data-categories="street" caption="Abendlicht wirft lange Schatten auf den Stadtplatz" onclick="openLightbox(this)">
    </div>
</div>

<div id="lightbox" class="lightboxOverlay" onclick="closeLightbox()">
    <div class="closeLightbox">&times;</div>
    <img id="lightboxImg" class="lightboxImg" src="" alt="">
    <div id="lightboxCaption" class="lightboxCaption"></div>
</div>

<div id="scrollTopBtn" class="scrollTopBtn" onclick="scrollToTop(event)">
    <svg class="scrollBtnSvg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
</div>

<script>
    function toggleMenu() { document.getElementById("fullScreenMenu").classList.toggle("active"); }
    function toggleLangMenu(event) { event.stopPropagation(); document.getElementById("langDropdown").classList.toggle("showLang"); }
    window.addEventListener('click', function() {
        const dropdown = document.getElementById("langDropdown");
        if (dropdown && dropdown.classList.contains("showLang")) { dropdown.classList.remove("showLang"); }
    });

    function filterGallery(category, element) {
        const tags = document.querySelectorAll('.filterTag');
        tags.forEach(tag => tag.classList.remove('activeTag'));
        element.classList.add('activeTag');
        
        const images = document.querySelectorAll('.galleryImg');
        images.forEach(img => {
            const categories = img.getAttribute('data-categories').split(' ');
            if (category === 'all' || categories.includes(category)) {
                img.style.display = '';
                setTimeout(() => img.style.opacity = '1', 10);
            } else {
                img.style.opacity = '0';
                img.style.display = 'none';
            }
        });
    }

    window.addEventListener('scroll', function() {
        const scrollTop = window.scrollY;
        const topBtn = document.getElementById('scrollTopBtn');
        if (scrollTop > 400) {
            topBtn.classList.add('showBtn');
        } else {
            topBtn.classList.remove('showBtn');
        }
    });

    function scrollToTop(event) {
        event.stopPropagation();
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    function openLightbox(imgElement) {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxCaption = document.getElementById("lightboxCaption");
        
        lightboxImg.src = imgElement.src;
        lightboxCaption.textContent = imgElement.getAttribute("caption") || "";
        lightbox.classList.add("activeLightbox");
    }

    function closeLightbox() {
        document.getElementById("lightbox").classList.remove("activeLightbox");
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeLightbox();
        }
    });
</script>

</body>
</html>
