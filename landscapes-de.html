<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Landschaften - Timor Novoselsky</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topVignette"></div>

<header class="fixedHeader">
    <div class="headerInner">
        <div class="branding">
            <a href="index-de.html">
                <h1>Timor Novoselsky</h1>
                <div class="subtitle">FOTOGRAFIE</div>
            </a>
        </div>
        
        <div class="navControls">
            <div class="langSwitch">
                <a href="landscapes.html" class="langOption">EN</a>
                <span class="langDivider">|</span>
                <a href="landscapes-de.html" class="langOption activeLang">DE</a>
            </div>
            
            <div class="navMenu" onclick="toggleMenu()">MENÜ</div>
        </div>
    </div>
</header>

<div id="fullScreenMenu" class="overlayMenu">
    <div class="closeBtn" onclick="toggleMenu()">&#10005;</div> 
    <div class="menuLinks">
        <a href="index-de.html" class="gapAfter">Startseite</a>
        <a href="wildlife-de.html">Wildtiere</a>
        <a href="landscapes-de.html">Landschaften</a>
        <a href="culture-de.html">Mensch & Kultur</a>
        <a href="stories-de.html" class="gapAfter">Geschichten</a>
        <a href="about-de.html">Über mich</a>
        <a href="contact-de.html">Kontakt</a>
    </div>
</div>

<div class="pageContainer">
    <div class="pageHeader">
        <h1 class="pageTitle">Landschaften</h1>
        <div class="filterContainer">
            <div class="filterTag activeTag" onclick="filterGallery('all', this)">Alle</div>
            <div class="filterTag" onclick="filterGallery('mountains', this)">Berge</div>
            <div class="filterTag" onclick="filterGallery('lakes', this)">Seen</div>
            <div class="filterTag" onclick="filterGallery('forests', this)">Wälder</div>
            <div class="filterTag" onclick="filterGallery('sea', this)">Meer</div>
            <div class="filterTag" onclick="filterGallery('desert', this)">Wüste</div>
            <div class="filterTag" onclick="filterGallery('city', this)">Stadt</div>
        </div>
    </div>

    <div class="galleryContainer">
        <img src="https://picsum.photos/800/600?random=111" class="galleryImg imgSmall" data-categories="city" caption="Kreuzende Pfade der Stadtarchitektur" onclick="openLightbox(this)">
        <img src="https://picsum.photos/800/600?random=112" class="galleryImg imgSmall" data-categories="desert mountains" caption="Karge Gipfel beim Sonnenuntergang" onclick="openLightbox(this)">
        
        <img src="https://picsum.photos/1200/600?random=113" class="galleryImg imgLarge" data-categories="sea mountains" caption="Klippen treffen auf den rauhen Ozean" onclick="openLightbox(this)">
        
        <img src="https://picsum.photos/800/600?random=114" class="galleryImg imgSmall" data-categories="forests mountains" caption="Pinienbäume bedecken das Tal" onclick="openLightbox(this)">
        <img src="https://picsum.photos/800/600?random=115" class="galleryImg imgSmall" data-categories="lakes forests" caption="Verborgenes Gewässer tief im Wald" onclick="openLightbox(this)">
        
        <img src="https://picsum.photos/1200/600?random=116" class="galleryImg imgLarge" data-categories="desert" caption="Endlose Dünen erstrecken sich bis zum Horizont" onclick="openLightbox(this)">
        
        <img src="https://picsum.photos/800/600?random=117" class="galleryImg imgSmall" data-categories="sea city" caption="Lichter der Küstenstadt verblassen im Wasser" onclick="openLightbox(this)">
        <img src="https://picsum.photos/800/600?random=118" class="galleryImg imgSmall" data-categories="lakes mountains" caption="Spiegelungen verschneiter Gipfel" onclick="openLightbox(this)">
        
        <img src="https://picsum.photos/1200/600?random=119" class="galleryImg imgLarge" data-categories="city mountains" caption="Metropole umgeben von riesigen Bergketten" onclick="openLightbox(this)">
    </div>
</div>

<div id="lightbox" class="lightboxOverlay" onclick="closeLightbox()">
    <div class="closeLightbox">&times;</div>
    <img id="lightboxImg" class="lightboxImg" src="" alt="">
    <div id="lightboxCaption" class="lightboxCaption"></div>
</div>

<div id="scrollTopBtn" class="scrollTopBtn" onclick="scrollToTop(event)">
    <svg class="scrollBtnSvg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
</div>

<script>
    function toggleMenu() { document.getElementById("fullScreenMenu").classList.toggle("active"); }
    function toggleLangMenu(event) { event.stopPropagation(); document.getElementById("langDropdown").classList.toggle("showLang"); }
    window.addEventListener('click', function() {
        const dropdown = document.getElementById("langDropdown");
        if (dropdown && dropdown.classList.contains("showLang")) { dropdown.classList.remove("showLang"); }
    });

    function filterGallery(category, element) {
        const tags = document.querySelectorAll('.filterTag');
        tags.forEach(tag => tag.classList.remove('activeTag'));
        element.classList.add('activeTag');
        
        const images = document.querySelectorAll('.galleryImg');
        images.forEach(img => {
            const categories = img.getAttribute('data-categories').split(' ');
            if (category === 'all' || categories.includes(category)) {
                img.style.display = '';
                setTimeout(() => img.style.opacity = '1', 10);
            } else {
                img.style.opacity = '0';
                img.style.display = 'none';
            }
        });
    }

    window.addEventListener('scroll', function() {
        const scrollTop = window.scrollY;
        const topBtn = document.getElementById('scrollTopBtn');
        if (scrollTop > 400) {
            topBtn.classList.add('showBtn');
        } else {
            topBtn.classList.remove('showBtn');
        }
    });

    function scrollToTop(event) {
        event.stopPropagation();
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    function openLightbox(imgElement) {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxCaption = document.getElementById("lightboxCaption");
        
        lightboxImg.src = imgElement.src;
        lightboxCaption.textContent = imgElement.getAttribute("caption") || "";
        lightbox.classList.add("activeLightbox");
    }

    function closeLightbox() {
        document.getElementById("lightbox").classList.remove("activeLightbox");
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeLightbox();
        }
    });
</script>

</body>
</html>
